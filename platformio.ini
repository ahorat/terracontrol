; PlatformIO Project Configuration File
;
; WiFi 4-Kanal Relaiscontroller mit RTC (ESP32-C6 / Arduino)
;
; Board: Waveshare ESP32-C6-Zero (ESP32-C6FH4, 4MB flash). No dedicated
; PlatformIO board entry exists for it, so we use the closest generic match
; (esp32-c6-devkitm-1, same chip/flash size); GPIO numbers are what matter
; and those are set explicitly in include/Config.h.
;
; Platform: the official "espressif32" platform does not ship Arduino
; framework support for the ESP32-C6 yet (its bundled arduino-esp32 core is
; missing the esp32c6 variant). Using the community-maintained pioarduino
; fork instead, which tracks Espressif's Arduino core releases and does
; support C6. https://github.com/pioarduino/platform-espressif32
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-zero]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.filesystem = littlefs

lib_deps =
	adafruit/RTClib@^2.1.4
	esp32async/ESPAsyncWebServer@^3.12.0
	esp32async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.2.1
	jpb10/SolarCalculator@^2.0.2

build_flags =
	-DCORE_DEBUG_LEVEL=1
